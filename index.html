<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Witaj, jestem Aleksa ❤️</h1>
    <p>Twoja osobista asystentka AI.</p>
    <div class="chat">
  <input type="text" placeholder="Napisz do Aleksy...">
  <button>Wyślij ❤️</button>
</div>
  </div>
  <script>
  const input = document.querySelector('.chat input');
  const button = document.querySelector('.chat button');

  button.addEventListener('click', function() {
    const message = input.value.trim();

    if (message === '') {
      return;
    }

    alert('Aleksa otrzymała: ' + message);
    input.value = '';
  });
</script>
</body>
</html>
